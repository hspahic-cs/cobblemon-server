modLoader = "kotlinforforge"
loaderVersion = "[5,)"
license = "All Rights Reserved"

[[mods]]
modId = "cobblemon_auction"
version = "${version}"
displayName = "Cobblemon Auction House"
description = "Persistent player-to-player market: list items for sale, buy others' listings, collect purchases from a mailbox."
authors = "almutwakel"
# Server-side only: clients don't need this jar. IGNORE_ALL_VERSION skips the
# version handshake so vanilla / mismatched clients can connect without rejection.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.cobblemon_auction]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cobblemon_auction]]
modId = "kotlinforforge"
type = "required"
versionRange = "[5,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cobblemon_auction]]
modId = "cobblemon"
type = "required"
versionRange = "[1.7.1,)"
ordering = "AFTER"
side = "BOTH"
