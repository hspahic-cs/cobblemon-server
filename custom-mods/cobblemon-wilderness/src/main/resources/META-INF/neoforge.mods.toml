# javafml modLoader, mirroring the working cobblemon-npc mixin mod: a plain Kotlin @Mod class
# with an (IEventBus, ModContainer) constructor that javafml instantiates; kotlinforforge stays
# a dependency below for the Kotlin stdlib. Our [[mixins]] config registers and applies under
# this setup (verified on the dev server).
modLoader = "javafml"
loaderVersion = "[4,)"
license = "All Rights Reserved"

[[mods]]
modId = "cobblemon_wilderness"
version = "${version}"
displayName = "Cobblemon Wilderness Reset"
description = "Resets wilderness chunks outside a persistent bounding box to cap world growth"
authors = "almutwakel"
# Server-side only: clients don't need this jar. IGNORE_ALL_VERSION skips the
# version handshake so vanilla / mismatched clients can connect without rejection.
displayTest = "IGNORE_ALL_VERSION"

# Primary structure-relocation hook (the salt XOR on getPotentialStructureChunk). REQUIRED: if this
# fails to apply, relocation is silently broken with no signal, so we want a loud boot failure.
# Inert at runtime unless reseedStructuresOutsideBox=true AND a region has actually been reset.
[[mixins]]
config = "cobblemon_wilderness.mixins.json"

# Dimension-gate mixins (thread the overworld signal into the salt hook so nether/end stay vanilla).
# required=false so a future MC/mapping break degrades to "structures don't relocate" instead of a
# boot crash-loop (dev auto-deploys from main HEAD → a failed required mixin = prod outage). If these
# fail to apply, the salt hook above still loads but the OVERWORLD ThreadLocal is never set, so
# cellSalt() returns 0 everywhere — no relocation, and critically no salt bleed into nether/end.
[[mixins]]
config = "cobblemon_wilderness.gate.mixins.json"

[[dependencies.cobblemon_wilderness]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cobblemon_wilderness]]
modId = "kotlinforforge"
type = "required"
versionRange = "[5,)"
ordering = "NONE"
side = "BOTH"
